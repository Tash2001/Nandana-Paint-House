<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Products</title>
  <link rel="stylesheet" href="../css/libs/bootstrap.min.css">
  <link rel="stylesheet" href="../css/libs/datatables.min.css">
  <link rel="stylesheet" href="../css/common.css">
</head>

<body>
  <div class="app-container d-flex">

    <!-- Sidebar placeholder -->
    <div id="sidebar-container"></div>

    <div id="loadingOverlay"
      style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(255,255,255,0.7); z-index:2000; justify-content:center; align-items:center;">
      <div class="spinner-border text-primary" role="status"></div>
    </div>



    <div class="container my-4">
      <h2>Products</h2>
      <table id="productTable" class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Brand</th>
            <th>Supplier</th>
            <th>Category</th>
            <th>Subcategory</th>
            <th>Unit</th>
            <th>Color</th>
            <th>Purchase Price</th>
            <th>Selling Price</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <button id="addProductBtn" class="btn btn-primary mt-3">Add Product</button>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1" role="dialog">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add Product</h5>
            <button type="button" class="close" data-dismiss="modal">&times;</button>
          </div>
          <div class="modal-body">
            <form id="productForm">
              <input type="hidden" id="productId" name="id">

              <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
              </div>

              <div class="form-group">
                <label for="brand_id">Brand</label>
                <select class="form-control" id="brand_id" name="brand_id" required></select>
              </div>

              <div class="form-group">
                <label for="supplier_id">Supplier</label>
                <select class="form-control" id="supplier_id" name="supplier_id" required></select>
              </div>

              <div class="form-group">
                <label for="category_id">Category</label>
                <select class="form-control" id="category_id" name="category_id" required></select>
              </div>

              <div class="form-group">
                <label for="subcategory_id">Subcategory</label>
                <select class="form-control" id="subcategory_id" name="subcategory_id" required></select>
              </div>

              <div class="form-group">
                <label for="unit_id">Unit</label>
                <select class="form-control" id="unit_id" name="unit_id" required></select>
              </div>

              <div class="form-group">
                <label for="color_id">Color</label>
                <select class="form-control" id="color_id" name="color_id"></select>
              </div>

              <div class="form-group">
                <label for="purchase_price">Purchase Price</label>
                <input type="number" step="0.01" class="form-control" id="purchase_price" name="purchase_price"
                  required>
              </div>

              <div class="form-group">
                <label for="selling_price">Selling Price</label>
                <input type="number" step="0.01" class="form-control" id="selling_price" name="selling_price" required>
              </div>

              <div class="form-group">
                <label for="description">Description</label>
                <textarea class="form-control" id="description" name="description"></textarea>
              </div>

            </form>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
            <button type="submit" form="productForm" class="btn btn-primary" id="saveProductBtn">Save</button>
          </div>

        </div>
      </div>
    </div>

    <!-- Scripts -->

    <script src="../js/libs/jquery.min.js"></script>
    <script src="../js/libs/bootstrap.bundle.min.js"></script>
    <script src="../js/libs/datatables.min.js"></script>
    <script src="../js/fetch.js"></script>
    <script src="../js/common.js"></script>


    <script>


      //MODAL BUTTON
      document.getElementById('addProductBtn').addEventListener('click', async () => {
        // reset form
        document.getElementById('productForm').reset();
        document.getElementById('productId').value = '';

        // Populate dropdowns
        await populateSelect("brand_id", getBrands);
        await populateSelect("supplier_id", getSuppliers);
        await populateSelect("unit_id", getUnits);
        await populateSelect("category_id", getCategories);
        await populateSelect("subcategory_id", getSubcategories);
        await populateSelect("color_id", getColors);

        // create & show modal
        const modalEl = document.getElementById('addProductModal');
        const modal = new bootstrap.Modal(modalEl);
        modal.show();
      });



      //MODAL DROPDOWNS POPULATION
      // Populate dropdowns (works for edit and add)
      async function populateSelect(selectId, fetchFn, valueKey = "id", textKey = "name", selectedValue = null) {
        const data = await fetchFn();
        const select = document.getElementById(selectId);
        select.innerHTML = `<option value="">Select...</option>`; // reset

        data.forEach(item => {
          const option = document.createElement("option");
          option.value = item[valueKey];
          option.textContent = item[textKey];

          if (selectedValue != null && item[valueKey] == selectedValue) {
            option.selected = true; // mark current value as selected
          }

          select.appendChild(option);
        });
      }





      $(document).ready(async function () {
        // Fetch products from backend
        const products = await getProducts();

        const table = $('#productTable').DataTable({
          data: products,
          columns: [
            { data: 'id' },
            { data: 'name' },
            { data: 'brand_name' },
            { data: 'supplier_name' },
            { data: 'category_name' },
            { data: 'subcategory_name' },
            { data: 'unit_name' },
            { data: 'color_name' },
            { data: 'purchase_price' },
            { data: 'selling_price' },
            { data: 'description' },
            {
              data: null, render: function (data, type, row) {
                return `
                <button class="btn btn-warning edit-btn" data-id="${row.id}">Edit</button>
                <button class="btn btn-danger delete-btn" data-id="${row.id}">Delete</button>`;
              }
            }
          ]
        });

      });




      //SAVING AND UPDATING
      document.getElementById("saveProductBtn").addEventListener("click", async (e) => {
        e.preventDefault(); // safety
        try {
          showLoading();
          await saveEntity("products", "productForm", "id");
          hideLoading();

          // Close modal
          bootstrap.Modal.getInstance(document.getElementById("addProductModal")).hide();

          // Refresh table
          const products = await getProducts();
          $('#productTable').DataTable().clear().rows.add(products).draw();

          // Success notification
          showToast("✅ Product saved successfully!", "success");
        } catch (err) {
          showToast("❌ Error saving product: " + err.message, "danger");
        }
      });


      //DELETING FUNCTION
      $('#productTable').on('click', '.delete-btn', async function () {
        const id = $(this).data('id');

        try {
          await deleteEntity("products", id);
          showToast("✅ Product deleted", "success");

          // Refresh table
          const products = await getProducts();
          $('#productTable').DataTable().clear().rows.add(products).draw();
        } catch (err) {
          showToast("❌ Error deleting product: " + err.message, "danger");
        }
      });



      //EDIT FUNCTION
      $('#productTable').on('click', '.edit-btn', async function () {
        const id = $(this).data('id');
        try {
          await editEntity("products", id, "productForm", "addProductModal");
        } catch (err) {
          showToast("❌ Error loading product: " + err.message, "danger");
        }
      });





    </script>
</body>

</html>
