<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Products</title>
  <link rel="stylesheet" href="../css/libs/bootstrap.min.css">
  <link rel="stylesheet" href="../css/libs/datatables.min.css">
  <link rel="stylesheet" href="../css/common.css">
</head>

<body>

  <!-- Sidebar placeholder -->
  <div id="sidebar-container"></div>


  <div class="container my-4">
    <h2>Products</h2>
    <table id="productTable" class="table table-striped table-bordered">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Brand</th>
          <th>Supplier</th>
          <th>Category</th>
          <th>Subcategory</th>
          <th>Unit</th>
          <th>Color</th>
          <th>Purchase Price</th>
          <th>Selling Price</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <button id="addProductBtn" class="btn btn-primary mt-3">Add Product</button>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add/Edit Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="productForm">
            <input type="hidden" id="productId">
            <!-- Form fields same as before -->
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success" id="saveProductBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/common.js"></script>
  <script src="../js/libs/jquery.min.js"></script>
  <script src="../js/libs/datatables.min.js"></script>
  <script src="../js/libs/bootstrap.bundle.min.js"></script>
  <script src="../js/fetch.js"></script>

  <script>
    $(document).ready(async function () {
      // Fetch products from backend
      const products = await getProducts();

      const table = $('#productTable').DataTable({
        data: products,
        columns: [
          { data: 'id' },
          { data: 'name' },
          { data: 'brand_name' },
          { data: 'supplier_name' },
          { data: 'category_name' },
          { data: 'subcategory_name' },
          { data: 'unit_name' },
          { data: 'color_name' },
          { data: 'purchase_price' },
          { data: 'selling_price' },
          { data: 'description' },
          {
            data: null, render: function (data, type, row) {
              return `
                <button class="btn btn-warning edit-btn" data-id="${row.id}">Edit</button>
                <button class="btn btn-danger delete-btn" data-id="${row.id}">Delete</button>`;
            }
          }
        ]
      });

      $('#addProductBtn').click(() => {
        $('#productForm')[0].reset();
        $('#productId').val('');
        $('#productModal').modal('show');
      });
    });
  </script>
</body>

</html>
